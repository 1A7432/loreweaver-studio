[package]
name = "loreweaver-studio"
description = "Loreweaver rich client + card forge studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "loreweaver_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
loreweaver-transport = { path = "../crates/transport" }
tauri-plugin-dialog = "2"
base64 = "0.22"
# LLM keys live in the OS credential store; the WebView never sees them.
# LLM requests go out from Rust (CSP stays strict, no CORS, key stays native-side).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Panel assets are content-addressed; bytes are verified against their sha256
# before they may enter the cache or be served to a panel iframe.
sha2 = "0.10"
# Decode percent-encoded panel:// request paths (author asset names may be non-ASCII).
percent-encoding = "2"

name: CI

on:
  push:
    # v3: the move to protocol 3.0 lives on its own branch until it is released.
    branches: [main, v3]
  pull_request:

# Every pushed SHA must finish its own run (milestone gating); queue, don't cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TEMPORARY: protocol 3.0's client library (`loreweaver-protocol/v3`) is a
      # path dependency on the engine checkout's `clients/protocol` until
      # loreweaver-protocol 3.0.0 is on npm (package.json, vite.config.ts), so
      # the engine's v3 branch must sit at the sibling path ../trpg_kp.
      - name: Clone the loreweaver engine (v3) for the protocol 3.0 library
        run: git clone --depth 1 --branch v3 https://github.com/1A7432/loreweaver.git ../trpg_kp
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      # The i18n red line: no user-facing string may skip locales/{en,zh}.json.
      - run: bun run i18n:lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  roundtrip:
    name: Cross-repo round-trip gate (live connect to a 3.0 server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gate starts the engine's REAL protocol 3.0 server (Bun, `serve
      # --local`) and dials it through the real Rust link, so the engine's v3
      # branch must sit at the script's default sibling path ../trpg_kp. Its
      # four static 2.x stages are parked (see scripts/check_roundtrip.sh).
      - name: Clone the loreweaver engine (v3)
        run: git clone --depth 1 --branch v3 https://github.com/1A7432/loreweaver.git ../trpg_kp
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Install the engine's dependencies
        run: bun install
        working-directory: ../trpg_kp
      # No Tauri system libs: the transport crate is standalone and the gate
      # builds only `-p loreweaver-transport`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the round-trip gate
        run: bash scripts/check_roundtrip.sh
        env:
          TRPG_KP_REPO: ../trpg_kp

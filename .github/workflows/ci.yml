name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every pushed SHA must finish its own run (milestone gating); queue, don't cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      # The i18n red line: no user-facing string may skip locales/{en,zh}.json.
      - run: bun run i18n:lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  roundtrip:
    name: Cross-repo round-trip gate (lorecard v1 + pack manifest v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate builds the studio's REAL emission with the engine's REAL
      # parsers (and diffs against its pinned fixtures), so the engine repo
      # must sit at the script's default sibling path ../trpg_kp.
      - name: Clone the loreweaver engine repo for the round-trip gate
        run: git clone --depth 1 https://github.com/1A7432/loreweaver.git ../trpg_kp
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      # The gate's stage-3 fixture ships a rules-script rulepack, which compiles
      # through QuickJS at pack-build time — and the engine keeps quickjs behind
      # its optional `ejs` extra. Without this the gate fails at its own
      # prerequisite check, by design, so sync the extra rather than skipping a
      # lane: a lane skipped in CI is a lane nobody guards.
      - name: Sync the engine's dependencies, ejs extra included
        run: uv sync --extra ejs
        working-directory: ../trpg_kp
      # Stage 5 dials the engine through the real transport crate, so this job
      # needs a toolchain too. No Tauri system libs: the transport crate is
      # standalone and the gate builds only `-p loreweaver-transport`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the round-trip gate
        run: bash scripts/check_roundtrip.sh
        env:
          TRPG_KP_REPO: ../trpg_kp

# Dependabot version updates — deliberately LOW-NOISE for a solo maintainer:
# monthly cadence, everything grouped into one PR per ecosystem. Security
# updates are separate (enabled repo-wide) and arrive as soon as a CVE lands.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      rust-deps:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      web-deps:
        patterns: ["*"]
    # TypeScript 7 waits for typescript-eslint: its 8.x line refuses to run on
    # TS 7.0 ("typescript-eslint does not support TS 7.0"), which fails lint for
    # the whole grouped PR. Drop this once a typescript-eslint release supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
